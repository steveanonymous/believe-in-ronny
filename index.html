<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELIEVE IN RONNY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jukebox-container">
        <img src="images/ronny-logo.png" alt="BELIEVE IN RONNY" class="logo">
        <p class="credits">All Songs Written and Performed by Ronny Pipes</p>
        <div class="track-list" id="track-list">
            <!-- Tracks will be generated by script.js -->
        </div>

        <div id="now-playing" class="now-playing">Select a track to play</div>

        <div class="player-controls">
            <div class="timeline-container">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-bar" value="0" min="0" step="1">
                <span id="remaining-time">-0:00</span>
            </div>
            
            <div class="control-buttons">
                <button id="prev-btn" onclick="playPreviousTrack()">⏮</button>
                <button id="play-pause-btn" onclick="togglePlayPause()">▶</button>
                <button id="next-btn" onclick="playNextTrack()">⏭</button>
            </div>
        </div>
        
        <button id="stop-btn" onclick="stopAudio()" style="display: none;">Stop Playback</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
